# TWINS CI: verification only. No deployment, no secrets, no external services or market data.
# All values below are CI-only test values for throwaway service containers.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22] # package.json engines: ">=20"; @types/node ^20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twins_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: twins_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twins_ci -d twins_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      CI: "true"
      TWINS_CI: "1" # activates tests/integration/runtime/ciGuard.test.ts
      NODE_ENV: test
      APP_ENV: development
      TRADING_MODE: paper
      LIVE_TRADING: "false"
      DATABASE_URL: postgresql://twins_ci:ci_only_not_a_secret@127.0.0.1:5432/twins_ci
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (lockfile, clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/unit-junit.xml

      - name: Workspace builds
        run: npm run build --workspaces --if-present

      - name: CI target guard (must pass before anything touches the databases)
        run: npx vitest run --config vitest.integration.config.ts tests/integration/runtime/ciGuard.test.ts

      - name: Fresh migration chain
        run: |
          mkdir -p reports
          npm run db:migrate -w @twins/database 2>&1 | tee reports/migrate.txt
          node scripts/ci/verify-migrations.mjs 2>&1 | tee -a reports/migrate.txt

      - name: Integration tests (real PostgreSQL + Redis, synthetic data only)
        run: npm run test:integration -- --reporter=default --reporter=junit --outputFile.junit=reports/integration-junit.xml

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-node-${{ matrix.node }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
