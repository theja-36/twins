# Operational alert when the `ci` workflow FAILS on main (Stage 2 / Task 5). Runs from the default branch with repository secrets after `ci` completes; it checks out
# nothing from the triggering run, and only fixed strings plus the (hex) commit SHA reach the payload. If no destination secret exists the step logs and exits 0.
name: ci-failure-alert

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Send WARNING alert (no secret is printed)
        env:
          TWINS_ALERT_WEBHOOK_URL: ${{ secrets.TWINS_ALERT_WEBHOOK_URL }}
          TWINS_ALERT_WEBHOOK_SECRET: ${{ secrets.TWINS_ALERT_WEBHOOK_SECRET }}
          TWINS_ENV_NAME: ci
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TWINS_ALERT_WEBHOOK_URL" ]; then echo "no alert destination configured (secret TWINS_ALERT_WEBHOOK_URL is unset); nothing sent"; exit 0; fi
          case "$SHA" in *[!0-9a-f]*|"") SHA=unknown ;; esac
          export TWINS_BUILD="${SHA:0:12}"
          bash infrastructure/staging/twins-alert.sh --throttle 0 ci.failed WARNING github-actions ci_failed "Hosted CI failed on main."
