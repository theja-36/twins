# Dependabot version updates. These open pull requests only; nothing is merged automatically.
# Security alerts/updates are enabled separately in the repository settings.
version: 2
updates:
  - package-ecosystem: "npm"            # root lockfile; covers all workspaces
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions" # .github/workflows
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"         # staging Dockerfile (digest-pinned base image)
    directory: "/infrastructure/staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "docker-compose" # digest-pinned postgres/redis images
    directory: "/infrastructure/staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "docker-compose" # local/CI test containers
    directory: "/infrastructure/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
